<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainDrop Testing Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 3em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-bottom: 20px;
            color: #667eea;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        .result.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .wallet-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧 ChainDrop</h1>
            <p>Testing Interface - Base Sepolia</p>
        </div>

        <div class="wallet-info">
            <strong>Test Wallet Address:</strong><br>
            0x1da9c1016a03f9154720E0691162B43219F2c436
        </div>

        <div class="card">
            <h2>📤 Send Transfer</h2>
            <div class="info-box">
                Send crypto to anyone using their email or phone number
            </div>

            <form id="sendForm">
                <div class="form-group">
                    <label>Recipient Email/Phone</label>
                    <input type="text" id="recipientId" placeholder="alice@example.com or +1234567890" required>
                </div>

                <div class="form-group">
                    <label>Amount (in ETH)</label>
                    <input type="number" id="amount" placeholder="0.001" step="0.001" required>
                </div>

                <div class="form-group">
                    <label>Token</label>
                    <select id="token">
                        <option value="ETH">ETH</option>
                        <option value="USDC">USDC</option>
                    </select>
                </div>

                <button type="submit">Send Transfer</button>
            </form>

            <div id="sendResult" class="result"></div>
        </div>

        <div class="card">
            <h2>📥 Claim Transfer</h2>
            <div class="info-box">
                Claim funds using your claim token
            </div>

            <form id="claimForm">
                <div class="form-group">
                    <label>Claim Token</label>
                    <input type="text" id="claimToken" placeholder="Paste claim token here" required>
                </div>

                <div class="form-group">
                    <label>Your Wallet Address</label>
                    <input type="text" id="walletAddress" placeholder="0x..." required>
                </div>

                <button type="submit">Claim Funds</button>
            </form>

            <div id="claimResult" class="result"></div>
        </div>

        <div class="card">
            <h2>🔍 Check Transfer Status</h2>

            <form id="statusForm">
                <div class="form-group">
                    <label>Claim Token</label>
                    <input type="text" id="statusToken" placeholder="Paste claim token here" required>
                </div>

                <button type="submit">Check Status</button>
            </form>

            <div id="statusResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Send Transfer Form
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('sendResult');

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.innerHTML = 'Sending...';

                const response = await fetch(`${API_URL}/transfer/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        senderAddress: '0x1da9c1016a03f9154720E0691162B43219F2c436',
                        recipientIdentifier: document.getElementById('recipientId').value,
                        identifierType: 'email',
                        amount: document.getElementById('amount').value,
                        tokenAddress: document.getElementById('token').value === 'ETH' ? null : '0x...'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Transfer Created!</h3>
                        <p><strong>Transfer ID:</strong> ${data.data.transferId}</p>
                        <p><strong>Claim Token:</strong> ${data.data.claimToken}</p>
                        <p><strong>Ghost Vault:</strong> ${data.data.recipientAddress}</p>
                        <p><strong>TX Hash:</strong> <a href="https://sepolia.basescan.org/tx/${data.data.txHash}" target="_blank">${data.data.txHash}</a></p>
                        <p style="margin-top: 10px; padding: 10px; background: #fff; border-radius: 4px;">
                            <strong>Share this claim token with recipient:</strong><br>
                            <code>${data.data.claimToken}</code>
                        </p>
                    `;
                } else {
                    throw new Error(data.error || 'Transfer failed');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        });

        // Claim Transfer Form
        document.getElementById('claimForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('claimResult');

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.innerHTML = 'Processing claim...';

                const response = await fetch(`${API_URL}/transfer/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        claimToken: document.getElementById('claimToken').value,
                        recipientWalletAddress: document.getElementById('walletAddress').value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Funds Claimed!</h3>
                        <p><strong>Amount:</strong> ${data.data.claimedAmount} ${data.data.token}</p>
                        <p><strong>TX Hash:</strong> <a href="https://sepolia.basescan.org/tx/${data.data.transactionHash}" target="_blank">${data.data.transactionHash}</a></p>
                        <p><strong>Account Address:</strong> ${data.data.deployedAccountAddress}</p>
                    `;
                } else {
                    throw new Error(data.error || 'Claim failed');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        });

        // Check Status Form
        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('statusResult');

            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result';
                resultDiv.innerHTML = 'Checking...';

                const response = await fetch(`${API_URL}/transfer/${document.getElementById('statusToken').value}`);
                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>Transfer Status</h3>
                        <pre>${JSON.stringify(data.data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to get status');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Error:</strong> ${error.message}`;
            }
        });
    </script>
</body>
</html>
